<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Banner Contract Calendar</title>
<style>
:root{--bg:#05090d;--panel:#0a1219;--panel2:#0e1922;--line:#214866;--blue:#49aeea;--gold:#d6b45c;--text:#e9edf1;--muted:#91a0aa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102333 0,#071018 35%,#030609 100%);color:var(--text);font-family:Georgia,serif;min-height:100vh}
header{border-bottom:1px solid #243542;background:#05090de8;position:sticky;top:0;z-index:20}
.top{max-width:1500px;margin:auto;display:flex;gap:18px;align-items:center;padding:13px 20px}.brand{font-size:25px;letter-spacing:4px;color:#fff;text-shadow:0 0 14px #287aa7}.brand b{color:var(--gold)}
nav{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:#09131b;color:#dcebf4;padding:9px 13px;text-decoration:none;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--blue);box-shadow:0 0 12px #1d77a955}
main{max-width:1500px;margin:auto;padding:22px}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:17px}.hero h1{margin:0;color:var(--gold);font-size:31px}.hero p{color:var(--muted);margin:5px 0 0}
.controls{display:flex;gap:7px;align-items:center}.month-title{min-width:190px;text-align:center;font-size:20px;color:#f1d985}
.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(310px,.72fr);gap:16px}
.calendar{border:1px solid var(--line);background:#071018;box-shadow:0 0 25px #0008}.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.dow div{padding:9px;text-align:center;color:#81c8ee;border-bottom:1px solid var(--line);font-weight:700}
.day{min-height:132px;padding:7px;border-right:1px solid #163042;border-bottom:1px solid #163042;background:#081119;overflow:hidden}.day:nth-child(7n){border-right:0}.day.out{opacity:.3}.day.today{box-shadow:inset 0 0 0 1px var(--gold)}.num{font-weight:700;color:#cbd7dd;margin-bottom:5px}
.event{display:block;text-decoration:none;border-left:3px solid var(--blue);background:#102331;margin:4px 0;padding:6px;color:#edf7ff;font-size:12px}.event:hover{background:#16334a}.rank{color:#efce72;font-weight:700}.time{color:#91d3f4}
.side{border:1px solid var(--line);background:#071018;padding:13px;height:max-content}.side h2{margin:0 0 9px;color:#e9cc74}.upcoming{display:grid;gap:9px}.card{border:1px solid #1f4158;background:#0a151e;padding:10px}.card h3{margin:0 0 5px;color:#dcecf5;font-size:16px}.meta{color:#8fc9e9;font-size:13px;line-height:1.5}.desc{color:#aeb9c0;font-size:12px;margin-top:6px;white-space:pre-wrap}.open{display:inline-block;margin-top:8px;color:#f2d77f;text-decoration:none}
.notice{border:1px solid #7a5720;background:#251b0b;color:#f0d28a;padding:9px;margin-bottom:12px}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.day{min-height:95px}.top{flex-wrap:wrap}nav{margin-left:0}.hero{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">BLACK <b>BANNER</b> CONTRACTS</div><nav><a class="btn" href="../character/">Character Sheet</a><a id="dmManage" class="btn hidden" href="./manage/">DM Contract Manager</a></nav></div></header>
<main>
<div class="hero"><div><h1>Contract Calendar</h1><p>Upcoming Black Banner contracts visible to all logged-in members.</p></div><div class="controls"><button id="prev" class="btn">◀</button><div id="monthTitle" class="month-title"></div><button id="today" class="btn">Today</button><button id="next" class="btn">▶</button></div></div>
<div id="notice" class="notice hidden"></div>
<div class="layout">
<section class="calendar"><div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div id="grid" class="grid"></div></section>
<aside class="side"><h2>Upcoming Contracts</h2><div id="upcoming" class="upcoming"></div></aside>
</div>
</main>
<script>
const API_BASE="https://api.blackbannercompany.com";
let cursor=new Date();cursor.setDate(1);let contracts=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDate(ms){return new Intl.DateTimeFormat("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}).format(new Date(ms)).replaceAll("/","-")}
function fmtTime(ms){return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",hour12:true}).format(new Date(ms))}
function key(d){return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`}
async function api(path){const r=await fetch(API_BASE+path,{credentials:"include"});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`Request failed (${r.status})`);return b}
async function load(){
 const monthStart=new Date(cursor.getFullYear(),cursor.getMonth()-1,1).getTime();
 const monthEnd=new Date(cursor.getFullYear(),cursor.getMonth()+2,1).getTime();
 const [cal,access]=await Promise.all([api(`/api/contracts/calendar?from=${monthStart}&to=${monthEnd}`),api("/api/contracts/access").catch(()=>({canManage:false}))]);
 contracts=[...new Map((cal.contracts||[]).map(c=>[c.id,c])).values()];
 document.getElementById("dmManage").classList.toggle("hidden",!access.canManage);
 render();
}
function render(){
 document.getElementById("monthTitle").textContent=cursor.toLocaleString("en-US",{month:"long",year:"numeric"});
 const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
 const grid=document.getElementById("grid");grid.innerHTML="";
 const now=new Date();
 for(let i=0;i<42;i++){
   const d=new Date(start);d.setDate(start.getDate()+i);
   const cell=document.createElement("div");cell.className="day"+(d.getMonth()!==cursor.getMonth()?" out":"")+(key(d)===key(now)?" today":"");
   const events=contracts.filter(c=>{const x=new Date(c.startAt);return key(x)===key(d)});
   cell.innerHTML=`<div class="num">${d.getDate()}</div>`+events.map(c=>`<a class="event" ${c.discordUrl?`href="${esc(c.discordUrl)}" target="_blank"`:""}><span class="rank">${esc(c.rank)}-Rank</span> · ${esc(c.name)}<br><span class="time">${fmtTime(c.startAt)}</span></a>`).join("");
   grid.appendChild(cell);
 }
 const future=contracts.filter(c=>c.startAt>=Date.now()).sort((a,b)=>a.startAt-b.startAt).slice(0,12);
 document.getElementById("upcoming").innerHTML=future.length?future.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="meta"><b>${esc(c.rank)}-Rank</b> · ${fmtDate(c.startAt)} at ${fmtTime(c.startAt)}<br>Accepted: ${c.accepted}/${c.maxPlayers}${c.waiting?` · Waiting: ${c.waiting}`:""}</div>${c.description?`<div class="desc">${esc(c.description)}</div>`:""}${c.discordUrl?`<a class="open" href="${esc(c.discordUrl)}" target="_blank">Open Contract in Discord →</a>`:""}</div>`).join(""):'<div class="card">No upcoming contracts currently scheduled.</div>';
}
document.getElementById("prev").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);load().catch(show)};
document.getElementById("next").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);load().catch(show)};
document.getElementById("today").onclick=()=>{cursor=new Date();cursor.setDate(1);load().catch(show)};
function show(e){const n=document.getElementById("notice");n.textContent=e.message||String(e);n.classList.remove("hidden")}
load().catch(show);
</script>
</body>
</html>
