<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Banner DM Contract Manager</title>
<style>
:root{--bg:#05090d;--panel:#09131b;--line:#24506e;--blue:#56b8eb;--gold:#dab85d;--text:#e8eef2;--muted:#9ba9b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#112a3b,#05090d 48%);color:var(--text);font-family:Georgia,serif;min-height:100vh}
header{border-bottom:1px solid #243d4e;background:#05090deb}.top{max-width:1350px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}.brand{font-size:24px;letter-spacing:3px;color:#fff}.brand b{color:var(--gold)}.top a{margin-left:auto}
.btn{border:1px solid var(--line);background:#0a151e;color:#e3f2fa;padding:8px 12px;text-decoration:none;cursor:pointer}.btn:hover{border-color:var(--blue)}
main{max-width:1350px;margin:auto;padding:22px}.locked{max-width:650px;margin:80px auto;border:1px solid #7d3939;background:#251010;padding:25px;text-align:center}.locked h1{color:#e48a8a}
h1{color:var(--gold);margin:0 0 5px}.sub{color:var(--muted);margin-bottom:18px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.list{display:grid;gap:10px}.card{border:1px solid var(--line);background:#09141c;padding:13px;display:grid;grid-template-columns:1fr auto;gap:12px}.card h3{margin:0;color:#e8f3f9}.meta{color:#8ecceb;font-size:13px;line-height:1.6}.desc{color:#b0bcc3;font-size:13px;margin-top:6px;white-space:pre-wrap}.counts{color:#e3c96f;text-align:right;white-space:nowrap}.hidden{display:none!important}.error{border:1px solid #773535;background:#210d0d;color:#f0aaaa;padding:10px;margin-bottom:12px}
@media(max-width:700px){.card{grid-template-columns:1fr}.counts{text-align:left}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">BLACK <b>BANNER</b> DM CONTRACTS</div><a class="btn" href="../">Public Calendar</a></div></header>
<main>
<div id="locked" class="locked hidden"><h1>DM Access Required</h1><p>This page is restricted to members with the Black Banner DM or Trial DM Discord role.</p><a class="btn" href="../">Return to Contract Calendar</a></div>
<div id="manager" class="hidden">
<h1>DM Contract Manager</h1><div class="sub">Private contract dashboard for DMs and Trial DMs.</div>
<div id="error" class="error hidden"></div>
<div class="toolbar"><button id="refresh" class="btn">Refresh Contracts</button></div>
<div id="list" class="list"></div>
</div>
</main>
<script>
const API_BASE="https://api.blackbannercompany.com";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDate(ms){return new Intl.DateTimeFormat("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}).format(new Date(ms)).replaceAll("/","-")}
function fmtTime(ms){return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",hour12:true}).format(new Date(ms))}
async function api(path){const r=await fetch(API_BASE+path,{credentials:"include"});const b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(b.error||`Request failed (${r.status})`);e.status=r.status;throw e}return b}
async function load(){
 try{
   const access=await api("/api/contracts/access");
   if(!access.canManage){document.getElementById("locked").classList.remove("hidden");return}
   document.getElementById("manager").classList.remove("hidden");
   const from=Date.now()-90*86400000,to=Date.now()+365*86400000;
   const d=await api(`/api/contracts/manage?from=${from}&to=${to}`);
   const rows=d.contracts||[];
   document.getElementById("list").innerHTML=rows.length?rows.map(c=>`<div class="card"><div><h3>#${c.id} — ${esc(c.name)}</h3><div class="meta">${esc(c.rank)}-Rank · ${fmtDate(c.startAt)} at ${fmtTime(c.startAt)} · ${c.durationHours} hr<br>Status: ${esc(c.status)} · Host ID: ${esc(c.creatorId)}</div>${c.description?`<div class="desc">${esc(c.description)}</div>`:""}${c.discordUrl?`<a class="btn" style="display:inline-block;margin-top:9px" target="_blank" href="${esc(c.discordUrl)}">Open Discord Contract</a>`:""}</div><div class="counts">Accepted ${c.accepted}/${c.maxPlayers}<br>Waiting ${c.waiting}<br>Tentative ${c.tentative}</div></div>`).join(""):'<div class="card">No contracts found.</div>';
 }catch(e){
   if(e.status===403){document.getElementById("locked").classList.remove("hidden");document.getElementById("manager").classList.add("hidden");return}
   const er=document.getElementById("error");er.textContent=e.message;er.classList.remove("hidden");document.getElementById("manager").classList.remove("hidden");
 }
}
document.getElementById("refresh").onclick=load;
load();
</script>
</body>
</html>
